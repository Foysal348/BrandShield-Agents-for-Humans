[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brandshield-agent"
version = "0.1.0"
description = "A human-governed brand-protection agent built with the Strands Agents SDK."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "BrandShield Team" }
]
dependencies = [
  "boto3>=1.43,<2",
  "pandas>=3.0,<4",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.2,<2",
  "strands-agents>=1.55,<2",
  "streamlit>=1.63,<2",
]

[project.urls]
Repository = "https://github.com/Foysal348/BrandShield-Agents-for-Humans"

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
